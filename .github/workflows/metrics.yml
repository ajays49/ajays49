name: Generate GitHub Metrics

on:
  # Runs automatically at midnight every day
  schedule:
    - cron: "0 0 * * *"
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ajays49
          template: classic
          
          # Base stats (header, activity commits, community stats)
          base: header, activity, community
          
          # Languages plugin (visual Breakdown of languages)
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          
          # Commit Calendar (Streak & Recent Activity Visuals)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Output configuration
          output_action: commit
          committer_message: "chore: update github metrics svg"
