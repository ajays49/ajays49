name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ajays49
          template: classic
          
          # Visual & Theme Settings
          config_theme: tokyonight
          config_timezone: Europe/Dublin
          
          # Core Statistics Included
          base: header, activity, community
          base_indepth: yes
          
          # Languages Section (Fixed to show actual languages)
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          plugin_languages_recent_days: 365
          
          # Coding Habits & Activity
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # Output configuration
          output_action: commit
          committer_message: "chore: update dark github metrics svg"
